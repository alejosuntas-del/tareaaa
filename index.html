<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolución de segundo grado</title>
</head>

<body>
    <h1>Resolución de operaciones de segundo grado</h1>  

    <h2>Ingrese los tres valores</h2>
    
    <form id="formularioValores">
        <div>
            <label for="valor1">Valor 1:</label>
            <input type="number" id="valor1" step="any" required>
        </div>
        
        <div>
            <label for="valor2">Valor 2:</label>
            <input type="number" id="valor2" step="any" required>
        </div>

        <div>
            <label for="valor3">Valor 3:</label>
            <input type="number" id="valor3" step="any" required>
        </div>

        <div>
            <button type="submit">respuestas</button>
        </div>
    </form>

    <div>
        <h2>Resultado</h2>
    </div>

    <div id="resultado">
        <!-- Aquí se mostrarán los datos -->
    </div>

    <!-- Java Script -->
    <script src="java.js"></script>
</body>
</html>
